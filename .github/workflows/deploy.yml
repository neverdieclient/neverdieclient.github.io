name: Publish telegUP

# The site source lives in `neverdieclient/telegUP`; this repository only
# hosts the built files. The reason: a custom domain can be attached to a
# *user site* (neverdieclient.github.io) but GitHub does not allow a project
# site (neverdieclient.github.io/telegUP) to use a third-party domain.
#
# The build runs on a schedule (every hour) and can be started by hand.
# GitHub does not let one repository trigger another repository's workflow
# without a personal token, and the token is deliberately not stored here.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: neverdieclient/telegUP
          ref: main
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build
        # the site is served from the root of the domain, so the base path is "/"
        run: npm run build
        working-directory: site
        env:
          VITE_BASE: /

      - name: Add the custom domain file
        run: echo "telegup.mooo.com" > site/dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
